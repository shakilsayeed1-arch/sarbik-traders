name: Build Sarbik Traders APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp

      - name: Extract Project
        run: |
          unzip -q Sarbik_Traders_Mobile_Build_Project.zip -d project

      - name: Build APK
        run: |
          cd project
          /tmp/gradle-8.9/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarbik-Traders-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
